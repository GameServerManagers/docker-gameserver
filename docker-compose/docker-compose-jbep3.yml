---
services:
  # bind mount example
  linuxgsm-jbep3-bind:
    image: gameservermanagers/gameserver:jbep3
    # image: ghcr.io/gameservermanagers/gameserver:jbep3
    container_name: jbep3server
    restart: unless-stopped
    volumes:
      - /path/to/linuxgsm/jbep3server:/data
    network_mode: host

  # volume example
  linuxgsm-jbep3-volume:
    image: gameservermanagers/gameserver:jbep3
    # image: ghcr.io/gameservermanagers/gameserver:jbep3
    container_name: jbep3server
    restart: unless-stopped
    volumes:
      - linuxgsm-jbep3:/data
    network_mode: host

volumes:
  linuxgsm-jbep3:
