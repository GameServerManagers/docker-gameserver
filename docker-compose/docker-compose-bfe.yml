---
services:
  # bind mount example
  linuxgsm-bfe-bind:
    image: gameservermanagers/gameserver:bfe
    # image: ghcr.io/gameservermanagers/gameserver:bfe
    container_name: bfeserver
    restart: unless-stopped
    volumes:
      - /path/to/linuxgsm/bfeserver:/data
    network_mode: host

  # volume example
  linuxgsm-bfe-volume:
    image: gameservermanagers/gameserver:bfe
    # image: ghcr.io/gameservermanagers/gameserver:bfe
    container_name: bfeserver
    restart: unless-stopped
    volumes:
      - linuxgsm-bfe:/data
    network_mode: host

volumes:
  linuxgsm-bfe:
