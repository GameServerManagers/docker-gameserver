---
services:
  # bind mount example
  linuxgsm-tf2c-bind:
    image: gameservermanagers/gameserver:tf2c
    # image: ghcr.io/gameservermanagers/gameserver:tf2c
    container_name: tf2cserver
    restart: unless-stopped
    volumes:
      - /path/to/linuxgsm/tf2cserver:/data
    network_mode: host

  # volume example
  linuxgsm-tf2c-volume:
    image: gameservermanagers/gameserver:tf2c
    # image: ghcr.io/gameservermanagers/gameserver:tf2c
    container_name: tf2cserver
    restart: unless-stopped
    volumes:
      - linuxgsm-tf2c:/data
    network_mode: host

volumes:
  linuxgsm-tf2c:
