---
services:
  # bind mount example
  linuxgsm-orar-bind:
    image: gameservermanagers/gameserver:orar
    # image: ghcr.io/gameservermanagers/gameserver:orar
    container_name: orarserver
    restart: unless-stopped
    volumes:
      - /path/to/linuxgsm/orarserver:/data
    network_mode: host

  # volume example
  linuxgsm-orar-volume:
    image: gameservermanagers/gameserver:orar
    # image: ghcr.io/gameservermanagers/gameserver:orar
    container_name: orarserver
    restart: unless-stopped
    volumes:
      - linuxgsm-orar:/data
    network_mode: host

volumes:
  linuxgsm-orar:
